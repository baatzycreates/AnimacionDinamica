<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reloj Mágico</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            color: #f8eaff;
            background: radial-gradient(circle, #39234f, #100d1b 75%);
        }

        h1 {
            color: #e8c8ff;
            letter-spacing: 4px;
            text-shadow: 0 0 15px #bd75ff;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #c7a9d9;
            margin-bottom: 35px;
            letter-spacing: 2px;
            font-size: 12px;
        }

        .clock {
            width: 320px;
            height: 320px;
            position: relative;
            border-radius: 50%;
            background: linear-gradient(145deg, #39264d, #1c142b);
            border: 8px solid #d8b46a;
            box-shadow:
                0 0 20px #c58bff,
                0 0 50px #9b5ccc,
                inset 0 0 20px #100817;
        }

        .clock::before {
            content: "";
            position: absolute;
            inset: 10px;
            border: 2px solid #a879c9;
            border-radius: 50%;
        }

        .number {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            font-size: 23px;
            font-weight: bold;
            color: #f5dca8;
            padding-top: 17px;
        }

        .n1 { transform: rotate(30deg); }
        .n2 { transform: rotate(60deg); }
        .n3 { transform: rotate(90deg); }
        .n4 { transform: rotate(120deg); }
        .n5 { transform: rotate(150deg); }
        .n6 { transform: rotate(180deg); }
        .n7 { transform: rotate(210deg); }
        .n8 { transform: rotate(240deg); }
        .n9 { transform: rotate(270deg); }
        .n10 { transform: rotate(300deg); }
        .n11 { transform: rotate(330deg); }

        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            border-radius: 10px;
            z-index: 5;
        }

        .hours {
            width: 8px;
            height: 75px;
            background: #e8c8ff;
            margin-left: -4px;
        }

        .minutes {
            width: 5px;
            height: 105px;
            background: #d8b46a;
            margin-left: -2.5px;
        }

        .seconds {
            width: 2px;
            height: 120px;
            background: #ff83b5;
            margin-left: -1px;
        }

        .center {
            position: absolute;
            width: 16px;
            height: 16px;
            background: #fff0c2;
            border: 3px solid #d8b46a;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }

        .info {
            margin-top: 35px;
            text-align: center;
            color: #d8bce9;
            line-height: 1.8;
            font-size: 13px;
        }

        .info strong {
            color: #f5dca8;
        }

        @media (max-width: 400px) {
            .clock {
                width: 280px;
                height: 280px;
            }

            .hours { height: 65px; }
            .minutes { height: 90px; }
            .seconds { height: 105px; }
        }
    </style>
</head>

<body>

    <h1>✦ RELOJ MÁGICO ✦</h1>
    <p class="subtitle">EL TIEMPO NO SE DETIENE</p>

    <div class="clock">

        <div class="number">12</div>
        <div class="number n1">1</div>
        <div class="number n2">2</div>
        <div class="number n3">3</div>
        <div class="number n4">4</div>
        <div class="number n5">5</div>
        <div class="number n6">6</div>
        <div class="number n7">7</div>
        <div class="number n8">8</div>
        <div class="number n9">9</div>
        <div class="number n10">10</div>
        <div class="number n11">11</div>

        <div class="hand hours" id="hours"></div>
        <div class="hand minutes" id="minutes"></div>
        <div class="hand seconds" id="seconds"></div>

        <div class="center"></div>
    </div>

    <div class="info">
        <div>Manecilla de horas: <strong>vr1 = 0.1°/s</strong></div>
        <div>Manecilla de minutos: <strong>vr2 = 6°/s</strong></div>
        <div>Manecilla de segundos: <strong>vr3 = 360°/s</strong></div>
        <p>Velocidad proporcional acelerada ×60 ✨</p>
    </div>

    <script>
        // Velocidades de rotación en grados por segundo
        const vr1 = 0.1;  // Horas
        const vr2 = 6;    // Minutos
        const vr3 = 360;  // Segundos

        const hours = document.getElementById("hours");
        const minutes = document.getElementById("minutes");
        const seconds = document.getElementById("seconds");

        let angleHours = 0;
        let angleMinutes = 0;
        let angleSeconds = 0;

        let previousTime = 0;

        function animateClock(currentTime) {

            if (previousTime !== 0) {
                // Tiempo transcurrido en segundos
                const deltaTime = (currentTime - previousTime) / 1000;

                // Actualizar cada manecilla según su velocidad
                angleHours += vr1 * deltaTime;
                angleMinutes += vr2 * deltaTime;
                angleSeconds += vr3 * deltaTime;

                // Aplicar rotación
                hours.style.transform = `rotate(${angleHours}deg)`;
                minutes.style.transform = `rotate(${angleMinutes}deg)`;
                seconds.style.transform = `rotate(${angleSeconds}deg)`;
            }

            previousTime = currentTime;

            requestAnimationFrame(animateClock);
        }

        requestAnimationFrame(animateClock);
    </script>

</body>
</html>
