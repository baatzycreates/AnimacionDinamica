<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mario Star!</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 24px 12px;
            background: #fff1a8;
            font-family: Arial, Helvetica, sans-serif;
            color: #57320b;
        }

        h1 {
            margin: 0;
            color: #e99b00;
            font-size: clamp(28px, 5vw, 48px);
            font-weight: 900;
            letter-spacing: 2px;
            text-shadow: 2px 3px 0 #fff;
        }

        p {
            margin: 0 0 4px;
            text-align: center;
            font-weight: bold;
        }

        canvas {
            display: block;
            width: min( min(90vw, 760px), 72vh );
            height: auto;
            aspect-ratio: 1 / 1;
            border: 5px solid #30251d;
            box-shadow: 0 10px 24px rgba(70, 48, 12, 0.25);
            background: #75d5e8;
        }

        .hint {
            font-size: 13px;
            font-weight: normal;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <h1>★ MARIO STAR! ★</h1>
    <p>¡Una estrella en movimiento!</p>

    <canvas id="escenario" width="980" height="980"></canvas>

    <p class="hint">Animación realizada con Canvas y JavaScript</p>

    <script>
        const canvas = document.getElementById("escenario");
        const ctx = canvas.getContext("2d");

        const fondo = new Image();
        const estrella = new Image();

        // Variables que controlan el movimiento de la estrella.
        const estrellaAnimada = {
            x: 115,
            baseY: 430,
            velocidad: 185,
            direccion: 1,
            tamano: 150,
            angulo: 0,
            tiempo: 0
        };

        let ultimoTiempo = 0;

        function dibujarEscenario() {
            // El fondo conserva las proporciones originales de la imagen.
            ctx.drawImage(fondo, 0, 0, canvas.width, canvas.height);
        }

        function dibujarEstrella() {
            const s = estrellaAnimada;
            const flotacion = Math.sin(s.tiempo * 2.4) * 48;
            const pulso = 1 + Math.sin(s.tiempo * 3.2) * 0.07;
            const y = s.baseY + flotacion;

            ctx.save();
            ctx.translate(s.x, y);
            ctx.rotate(s.angulo);
            ctx.scale(pulso, pulso);

            // Brillo suave alrededor de la estrella.
            ctx.shadowColor = "rgba(255, 220, 30, 0.95)";
            ctx.shadowBlur = 28;
            ctx.drawImage(
                estrella,
                -s.tamano / 2,
                -s.tamano / 2,
                s.tamano,
                s.tamano
            );
            ctx.restore();
        }

        function animar(tiempoActual) {
            requestAnimationFrame(animar);

            // deltaTime hace que la velocidad sea más uniforme.
            const delta = ultimoTiempo === 0 ? 0 : Math.min((tiempoActual - ultimoTiempo) / 1000, 0.04);
            ultimoTiempo = tiempoActual;

            if (!fondo.complete || !estrella.complete) return;

            estrellaAnimada.tiempo += delta;
            estrellaAnimada.x += estrellaAnimada.velocidad * estrellaAnimada.direccion * delta;
            estrellaAnimada.angulo += delta * 1.15;

            // La estrella rebota en los límites del escenario.
            const limite = estrellaAnimada.tamano / 2 + 28;
            if (estrellaAnimada.x >= canvas.width - limite) {
                estrellaAnimada.x = canvas.width - limite;
                estrellaAnimada.direccion = -1;
            } else if (estrellaAnimada.x <= limite) {
                estrellaAnimada.x = limite;
                estrellaAnimada.direccion = 1;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            dibujarEscenario();
            dibujarEstrella();
        }

        // Inicia la animación cuando ambas imágenes estén cargadas.
        let imagenesListas = 0;
        function imagenCargada() {
            imagenesListas++;
            if (imagenesListas === 2) requestAnimationFrame(animar);
        }
        fondo.onload = imagenCargada;
        estrella.onload = imagenCargada;
        fondo.src = "mariobackground.jpg";
        estrella.src = "star.png";
    </script>
</body>
</html>
